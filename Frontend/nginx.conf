server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Redirect auth-related routes to /app prefix
  location = /login {
    return 301 /app/login;
  }
  location = /register {
    return 301 /app/register;
  }
  location = /forgot-password {
    return 301 /app/forgot-password;
  }
  location = /reset-password {
    return 301 /app/reset-password;
  }

  

  # Handle /app routes - files are in root, but URLs start with /app
  location /app/ {
    try_files $uri $uri/ /index.html;
  }

  # Handle asset files (they'll have /app/assets/ prefix from Vite)
  location /app/assets/ {
    alias /usr/share/nginx/html/assets/;
  }

  # Handle media files
  location /app/media/ {
    alias /usr/share/nginx/html/media/;
  }

  # Fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
} 



