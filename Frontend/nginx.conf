server {
  listen       80;
  root   /usr/share/nginx/html;
  index  index.html;

  # Serve the Frontend app at /app path
  # Since Vite builds with base='/app/', all assets are already prefixed with /app/
  location /app {
    try_files $uri $uri/ /index.html;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # Return 404 for any other path
  location / {
    return 404;
  }
}
